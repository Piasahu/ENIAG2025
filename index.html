<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENIAG 2025 Dashboard</title>
  <style>
    :root {
      --bg: #040b16;
      --bg-soft: #091529;
      --panel: rgba(9, 22, 45, 0.78);
      --panel-strong: rgba(10, 28, 57, 0.92);
      --line: rgba(122, 194, 255, 0.18);
      --line-strong: rgba(122, 194, 255, 0.42);
      --text: #ecf7ff;
      --muted: #9bb9d8;
      --accent: #56d5ff;
      --accent-2: #2f8cff;
      --accent-3: #8be9ff;
      --good: #59f3c2;
      --warn: #ffd970;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
      --radius: 22px;
      --radius-sm: 14px;
      --heading: "Avenir Next Condensed", "Trebuchet MS", "Arial Narrow", sans-serif;
      --body: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--body);
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(86, 213, 255, 0.12), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(47, 140, 255, 0.16), transparent 28%),
        radial-gradient(circle at 76% 78%, rgba(76, 203, 255, 0.08), transparent 30%),
        linear-gradient(180deg, #030812 0%, #07101d 55%, #050b16 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        linear-gradient(rgba(122, 194, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 194, 255, 0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 96%);
    }

    body::after {
      background:
        linear-gradient(180deg, transparent, rgba(86, 213, 255, 0.03), transparent);
      animation: sweep 7s linear infinite;
      opacity: 0.5;
    }

    @keyframes sweep {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1440px, calc(100% - 32px));
      margin: 20px auto 36px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(15, 36, 72, 0.92), rgba(6, 18, 39, 0.9)),
        linear-gradient(90deg, rgba(86, 213, 255, 0.12), transparent);
      border: 1px solid var(--line-strong);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -10% -40% auto;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(86, 213, 255, 0.22), transparent 68%);
      filter: blur(10px);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid rgba(139, 233, 255, 0.26);
      border-radius: 999px;
      background: rgba(86, 213, 255, 0.08);
      color: var(--accent-3);
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow a,
    .footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(139, 233, 255, 0.4);
    }

    .eyebrow a:hover,
    .footer a:hover {
      border-bottom-color: rgba(139, 233, 255, 0.9);
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      font-family: var(--heading);
      letter-spacing: 0.02em;
    }

    .hero-title {
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 0.95;
      margin-top: 16px;
      max-width: 860px;
      text-wrap: balance;
    }

    .hero-subtitle {
      margin-top: 14px;
      max-width: 900px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .meta-card {
      background: rgba(5, 15, 30, 0.56);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 16px 14px;
      min-height: 116px;
      backdrop-filter: blur(10px);
    }

    .meta-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-3);
    }

    .meta-value {
      font-family: var(--heading);
      font-size: clamp(1.5rem, 2vw, 2rem);
      margin-top: 10px;
    }

    .meta-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .lang-toggle {
      display: inline-flex;
      padding: 5px;
      border-radius: 999px;
      background: rgba(4, 12, 24, 0.76);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .lang-toggle button {
      cursor: pointer;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 14px;
      min-width: 92px;
      font-weight: 700;
      border-radius: 999px;
      transition: 180ms ease;
      font-family: var(--body);
    }

    .lang-toggle button.active {
      color: #031220;
      background: linear-gradient(90deg, var(--accent), #8de7ff);
      box-shadow: 0 0 20px rgba(86, 213, 255, 0.34);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(9, minmax(145px, 1fr));
      gap: 10px;
      margin: 18px 0 20px;
    }

    .tab-btn {
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(7, 18, 36, 0.7);
      color: var(--text);
      border-radius: 18px;
      padding: 14px 14px 12px;
      text-align: left;
      min-height: 88px;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .tab-btn:hover,
    .tab-btn:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(86, 213, 255, 0.5);
      outline: none;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, rgba(19, 51, 100, 0.96), rgba(8, 22, 46, 0.92));
      border-color: rgba(86, 213, 255, 0.6);
      box-shadow: 0 0 24px rgba(47, 140, 255, 0.16);
    }

    .tab-kicker {
      display: block;
      font-size: 0.72rem;
      color: var(--accent-3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tab-title {
      display: block;
      font-size: 0.96rem;
      line-height: 1.3;
      font-weight: 700;
    }

    .content {
      display: grid;
      gap: 16px;
    }

    .section-hero,
    .panel,
    .quote-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .section-hero {
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(17, 38, 70, 0.96), rgba(7, 18, 37, 0.84)),
        radial-gradient(circle at top right, rgba(86, 213, 255, 0.16), transparent 35%);
    }

    .section-kicker {
      color: var(--accent-3);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.78rem;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(1.7rem, 2.5vw, 2.7rem);
      line-height: 1;
      max-width: 820px;
      text-wrap: balance;
    }

    .section-intro {
      margin-top: 14px;
      max-width: 920px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(86, 213, 255, 0.08);
      border: 1px solid rgba(86, 213, 255, 0.18);
      font-size: 0.85rem;
      color: var(--text);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .panel {
      padding: 20px;
    }

    .panel-title {
      font-size: 1.18rem;
      margin-bottom: 10px;
    }

    .panel-subtitle {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.96rem;
      margin-bottom: 18px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: rgba(4, 14, 28, 0.68);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      min-height: 130px;
    }

    .stat-value {
      font-family: var(--heading);
      font-size: clamp(1.55rem, 2vw, 2.2rem);
      margin: 8px 0 10px;
    }

    .stat-label {
      color: var(--accent-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.74rem;
    }

    .stat-text {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .note {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
      margin-top: 12px;
    }

    .bullet-list {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .bullet-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      line-height: 1.6;
      color: var(--text);
    }

    .bullet-list li::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 9px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 16px rgba(86, 213, 255, 0.4);
      flex-shrink: 0;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(4, 14, 28, 0.5);
    }

    .data-table th,
    .data-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(122, 194, 255, 0.08);
      vertical-align: middle;
    }

    .data-table th {
      color: var(--accent-3);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(13, 36, 68, 0.72);
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .value-cell {
      min-width: 130px;
    }

    .value-track {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .value-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 18px rgba(86, 213, 255, 0.28);
    }

    .value-fill.student {
      background: linear-gradient(90deg, #2f8cff, #82b8ff);
    }

    .value-fill.faculty {
      background: linear-gradient(90deg, #14d6ff, #86f4ff);
    }

    .value-number {
      font-size: 0.88rem;
      color: var(--text);
      font-weight: 700;
    }

    .comparison {
      display: grid;
      gap: 14px;
    }

    .comparison-row {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) 1fr 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid rgba(122, 194, 255, 0.08);
      border-radius: 18px;
      background: rgba(4, 14, 28, 0.46);
    }

    .comparison-label {
      font-weight: 700;
      line-height: 1.4;
    }

    .comparison-metric {
      padding: 12px;
      border-radius: 14px;
      background: rgba(10, 25, 48, 0.7);
      border: 1px solid rgba(122, 194, 255, 0.08);
    }

    .comparison-role {
      color: var(--accent-3);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .comparison-value {
      font-family: var(--heading);
      font-size: 1.3rem;
    }

    .quote-panel {
      padding: 24px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(17, 45, 89, 0.95), rgba(6, 16, 33, 0.92));
    }

    .quote-panel::before {
      content: "";
      position: absolute;
      inset: auto auto -60px -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(86, 213, 255, 0.24), transparent 72%);
    }

    .quote-text {
      position: relative;
      font-size: 1.14rem;
      line-height: 1.7;
      max-width: 880px;
    }

    .quote-author {
      margin-top: 12px;
      color: var(--accent-3);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.78rem;
    }

    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }

    .rank-card {
      padding: 14px 12px;
      border-radius: 16px;
      border: 1px solid rgba(122, 194, 255, 0.1);
      background: rgba(4, 14, 28, 0.52);
    }

    .rank-name {
      font-size: 0.86rem;
      line-height: 1.35;
      color: var(--muted);
      min-height: 38px;
    }

    .rank-value {
      margin-top: 10px;
      font-family: var(--heading);
      font-size: 1.14rem;
    }

    .principles-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .principle-card {
      position: relative;
      padding: 18px 18px 18px 58px;
      border-radius: 18px;
      border: 1px solid rgba(122, 194, 255, 0.12);
      background: rgba(4, 14, 28, 0.56);
      min-height: 166px;
    }

    .principle-index {
      position: absolute;
      left: 18px;
      top: 18px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #02111f;
      font-weight: 800;
      font-size: 0.82rem;
      box-shadow: 0 0 18px rgba(86, 213, 255, 0.34);
    }

    .principle-title {
      font-size: 1.02rem;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .principle-copy {
      color: var(--muted);
      line-height: 1.58;
      font-size: 0.93rem;
    }

    .footer {
      margin-top: 18px;
      padding: 18px 20px 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
      text-align: center;
    }

    .small {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .spacer-top {
      margin-top: 4px;
    }

    @media (max-width: 1180px) {
      .hero-meta,
      .grid.four,
      .grid.three,
      .grid.two,
      .principles-grid {
        grid-template-columns: 1fr 1fr;
      }

      .tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .shell {
        width: min(100% - 20px, 1440px);
        margin-top: 10px;
      }

      .hero {
        padding: 22px 18px 18px;
        border-radius: 24px;
      }

      .hero-top {
        flex-direction: column;
      }

      .hero-meta,
      .grid.four,
      .grid.three,
      .grid.two,
      .principles-grid,
      .tabs {
        grid-template-columns: 1fr;
      }

      .comparison-row {
        grid-template-columns: 1fr;
      }

      .section-hero,
      .panel,
      .quote-panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <span class="eyebrow" id="heroEyebrow"></span>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-subtitle" id="heroSubtitle"></p>

        <div class="lang-toggle" aria-label="Language toggle">

      <div class="hero-meta" id="heroMeta"></div>
    </section>

    <nav class="tabs" id="tabs"></nav>
    <main class="content" id="content"></main>
    <div class="footer" id="footerText"></div>
  </div>

            <li>${state.lang === "en" ? "Venting or feeling listened to." : "Desahogarse o sentir que alguien escucha."}</li>
            <li>${state.lang === "en" ? "Looking for motivation or encouraging words." : "Buscar motivación o palabras de ánimo."}</li>
            <li>${state.lang === "en" ? "Simulating a supportive conversation." : "Simular una conversación con alguien que apoye."}</li>
            <li>${state.lang === "en" ? "Assessing whether psychological help may be needed." : "Evaluar si podría necesitarse ayuda psicológica."}</li>
          </ul>
          <div class="note">${state.lang === "en"
            ? "The report treats this as an emerging trend: AI can serve as a complementary channel, but it must not replace human and institutional care structures."
            : "El informe trata esto como una tendencia emergente: la IA puede funcionar como canal complementario, pero no debe sustituir las estructuras humanas e institucionales de cuidado."}</div>
        </section>
      `;
    }

    function renderAgenda() {
      const section = copy[state.lang].sections.agenda;
      return `
        ${sectionHero(section)}
        <div class="grid two">
          <section class="panel">
            <h3 class="panel-title">${state.lang === "en" ? "Agenda framing" : "Encuadre de la agenda"}</h3>
            <ul class="bullet-list">
              <li>${state.lang === "en"
                ? "The report says AI is already part of everyday academic life and can no longer be addressed through institutional waiting."
                : "El informe afirma que la IA ya forma parte de la vida académica cotidiana y ya no puede abordarse desde la espera institucional."}</li>
              <li>${state.lang === "en"
                ? "The ten principles are presented as orientation points, not final or closed guidelines."
                : "Los diez principios se presentan como orientaciones, no como lineamientos definitivos o cerrados."}</li>
              <li>${state.lang === "en"
                ? "The closing call is explicitly collective: government, institutions, faculty and students must all participate."
                : "El llamado final es explícitamente colectivo: gobierno, instituciones, docentes y estudiantes deben participar."}</li>
            </ul>
          </section>
          <section class="quote-panel">
            <div class="quote-text">${state.lang === "en"
              ? "Instead of prohibiting or trivializing, this is the moment to rethink what learning means in the new digital environment."
              : "En vez de prohibir o banalizar, este es el momento de volver a pensar qué significa aprender en el nuevo entorno digital."}</div>
            <div class="quote-author">Daniel Innerarity</div>
          </section>
        </div>
        <section class="panel">
          <h3 class="panel-title">${state.lang === "en" ? "Ten action principles" : "Diez principios de acción"}</h3>
          <div class="panel-subtitle">${state.lang === "en"
            ? "Condensed from pages 30-36 of the report."
            : "Sintetizados a partir de las páginas 30-36 del informe."}</div>
          <div class="principles-grid">
            ${principles.map((item, index) => `
              <article class="principle-card">
                <div class="principle-index">${index + 1}</div>
                <h4 class="principle-title">${t(item.title)}</h4>
                <div class="principle-copy">${t(item.copy)}</div>
              </article>
            `).join("")}
          </div>
        </section>
        <section class="panel">
          <h3 class="panel-title">${state.lang === "en" ? "Final call to action" : "Llamado final a la acción"}</h3>
          <div class="panel-subtitle">${state.lang === "en"
            ? "The report calls for informed governance, permanent monitoring, collegial spaces for decision-making, updated regulation, teacher training and curricular redesign. In short: institutions should not respond to AI with silence, improvisation or denial."
            : "El informe convoca a una gobernanza informada, seguimiento permanente, espacios colegiados de decisión, normatividad actualizada, formación docente y rediseño curricular. En síntesis: las instituciones no deben responder a la IA con silencio, improvisación o negación."}</div>
        </section>
      `;
    }

    function renderContent() {
      const views = {
        overview: renderOverview,
        importance: renderImportance,
        methodology: renderMethodology,
        adoption: renderAdoption,
        learning: renderLearning,
        transformation: renderTransformation,
        risks: renderRisks,
        beyond: renderBeyond,
        agenda: renderAgenda
      };
      document.getElementById("content").innerHTML = views[state.tab]();
    }

    function renderApp() {
      renderHero();
      renderTabs();
      renderContent();
      document.querySelectorAll("[data-lang]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === state.lang);
      });
      document.documentElement.lang = state.lang;
    }

    document.querySelectorAll("[data-lang]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.lang = btn.dataset.lang;
        renderApp();
      });
    });

    renderApp();
  </script>
</body>
</html>
